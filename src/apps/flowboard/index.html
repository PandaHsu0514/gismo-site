<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="description" content="免安裝的網頁版流程圖編輯器：方框、判斷菱形、輸入輸出、文件、箭頭與線條，可自動排版並匯出 PNG、SVG、JSON。">
<link rel="icon" href="/assets/favicon.svg">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>流程繪板｜勇博講古</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting desk — command bar on top, tool rail left, dotted canvas center, inspector right; on phones the rail drops to the bottom and the inspector floats as a sheet */
:root{
  --bg:#f5efe3; --canvas:#faf6ee; --panel:#fbf7ef; --line:#e2d7c3; --ink:#2b2520; --muted:#776b5d;
  --accent:#b23a26; --accent-soft:#f3dfd6; --dot:#d8cbb3; --danger:#a8321f;
  --font-display:"Noto Serif TC","Songti TC",serif;
  --font-ui:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1815; --canvas:#1f1b18; --panel:#24201c; --line:#3a332c; --ink:#ece3d4; --muted:#a69888;
  --accent:#e0775f; --accent-soft:#3a2520; --dot:#3a332c; --danger:#f08a74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1815; --canvas:#1f1b18; --panel:#24201c; --line:#3a332c; --ink:#ece3d4; --muted:#a69888;
  --accent:#e0775f; --accent-soft:#3a2520; --dot:#3a332c; --danger:#f08a74; color-scheme:dark}

html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#app{position:relative;height:100%;display:grid;grid-template-columns:56px minmax(0,1fr) 264px;grid-template-rows:auto minmax(0,1fr)}

/* command bar */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:10px;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.04em}
.back{color:var(--muted);text-decoration:none;font-size:13px;margin-right:4px}
.back:hover{color:var(--accent)}
.brand svg{color:var(--accent)}
.brand small{font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--muted)}
.grp{display:flex;align-items:center;gap:2px;padding:0 6px;border-left:1px solid var(--line)}
.grp.end{margin-left:auto;border-left:0}
.btn{height:32px;min-width:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn.icon{padding:0;width:32px}
.btn.primary{background:var(--accent);color:var(--panel);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
#zoomLbl{font-family:var(--font-mono);font-size:12px;width:48px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}

/* tool rail */
.tools{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.tool{position:relative;width:42px;height:40px;flex:none;border:0;border-radius:8px;background:transparent;cursor:pointer;display:grid;place-items:center}
.tool:hover{background:var(--accent-soft)}
.tool.on{background:var(--accent);color:var(--panel)}
.tool kbd{position:absolute;right:3px;bottom:2px;font-family:var(--font-mono);font-size:9px;opacity:.55}
.rule{width:28px;height:1px;flex:none;background:var(--line);margin:5px 0}

/* canvas */
.stage{position:relative;overflow:hidden;background:var(--canvas);min-width:0}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#svg[data-tool="select"]{cursor:default}
#svg[data-tool="hand"],#svg.panning{cursor:grab}
#svg.panning:active{cursor:grabbing}
#svg:not([data-tool="select"]):not([data-tool="hand"]){cursor:crosshair}
#svg[data-tool="select"] .node{cursor:move}
#svg[data-tool="select"] .edge{cursor:pointer}
#overlayL *{pointer-events:none}
#overlayL .anchor,#overlayL .handle,#overlayL .ehandle{pointer-events:all}
.anchor{cursor:crosshair;fill:var(--panel);stroke:var(--accent)}
.anchor:hover,.anchor.hot{fill:var(--accent)}
.handle{fill:var(--panel);stroke:var(--accent)}
.handle[data-h="nw"],.handle[data-h="se"]{cursor:nwse-resize}
.handle[data-h="ne"],.handle[data-h="sw"]{cursor:nesw-resize}
.ehandle{fill:var(--accent);stroke:var(--panel);cursor:move}
.selbox{fill:none;stroke:var(--accent)}
.hotnode{fill:none;stroke:var(--accent);opacity:.55}
.marq{fill:var(--accent-soft);fill-opacity:.45;stroke:var(--accent)}
.ghost{fill:var(--accent-soft);fill-opacity:.5;stroke:var(--accent)}

#editor{position:absolute;z-index:5;resize:none;border:1.5px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--ink);font-family:var(--font-ui);text-align:center;padding:4px 6px;line-height:1.35;outline:none;box-shadow:0 4px 18px rgb(0 0 0 / .12)}
.hint{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);padding:6px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;pointer-events:none}

/* inspector */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.ph{display:block;margin-top:8px;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.ph:first-child{margin-top:0}
.ptitle{font-weight:700;font-size:15px}
.panel textarea,.panel input[type=text]{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--canvas);color:var(--ink);font:inherit;padding:7px 9px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;height:28px;border:0;border-radius:6px;background:transparent;cursor:pointer;font-size:13px}
.seg button:hover{background:var(--accent-soft)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.shapes{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.shapes button{height:32px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;display:grid;place-items:center}
.shapes button:hover{background:var(--accent-soft)}
.shapes button.on{border-color:var(--accent);color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.acts .btn{border:1px solid var(--line);height:30px;font-size:13px}
.acts .del{color:var(--danger)}
.stat{margin:0;color:var(--muted)}
.stat b{font-family:var(--font-mono);color:var(--ink);font-weight:500}
.howto{margin:0;padding-left:18px;color:var(--ink);line-height:1.7;font-size:13px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:12.5px}
.keys dt{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.keys dd{margin:0}

/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgb(10 14 20 / .45);padding:16px}
.card{width:min(680px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 18px 50px rgb(0 0 0 / .25)}
.card h2{margin:0;font-size:17px}
.card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .sp{flex:1}
#mText{width:100%;min-height:260px;flex:1;border:1px solid var(--line);border-radius:8px;background:var(--canvas);color:var(--ink);font-family:var(--font-mono);font-size:12px;padding:10px;resize:vertical}
#mImg{max-width:100%;max-height:46vh;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;align-self:center}
.note{font-size:12px;color:var(--muted);margin:0}
.btn.outline{border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .brand small,.bar .lbl{display:none}
  .tools{grid-row:3;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 16px;border-right:0;border-top:1px solid var(--line)}
  .rule{width:1px;height:26px;margin:0 5px}
  .panel{position:absolute;left:12px;right:12px;bottom:66px;max-height:44%;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0 / .18);z-index:6}
  #app:not(.has-sel) .panel{display:none}
  .hint{display:none}
}
@media (min-width:761px){.only-m{display:none}}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

</head>
<body>
<div id="app">
  <header class="bar">
    <a class="back" id="backLink" href="/tools/" hidden>← AI 小工具</a>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="3" width="9" height="6" rx="1.2"/><path d="M7 9v4.5h6"/><path d="M17.5 10l4 4-4 4-4-4z"/><path d="M11 13.5l2 0" /></svg>
      流程繪板 <small>v0.1</small>
    </div>
    <div class="grp">
      <button class="btn icon" id="bUndo" title="復原 (⌘/Ctrl+Z)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="btn icon" id="bRedo" title="重做 (⌘/Ctrl+Shift+Z)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    </div>
    <div class="grp">
      <button class="btn icon" id="bZoomOut" title="縮小">−</button>
      <span id="zoomLbl">100%</span>
      <button class="btn icon" id="bZoomIn" title="放大">+</button>
      <button class="btn" id="bFit" title="顯示全部 (⇧1)"><span>全覽</span></button>
    </div>
    <div class="grp end">
      <button class="btn" id="bLayout" title="依連線由上而下自動排列"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="5" rx="1"/><rect x="2" y="17" width="8" height="5" rx="1"/><rect x="14" y="17" width="8" height="5" rx="1"/><path d="M12 7v5M6 17v-5h12v5"/></svg><span class="lbl">自動排版</span></button>
      <button class="btn" id="bClear" title="清空畫布（可復原）"><span class="lbl">清空</span><svg class="only-m" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      <button class="btn primary" id="bExport">匯出 / 匯入</button>
    </div>
  </header>

  <nav class="tools" id="tools" aria-label="工具"></nav>

  <main class="stage" id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" data-tool="select">
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="1" fill="var(--dot)"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      <g id="world"><g id="edgesL"></g><g id="nodesL"></g><g id="overlayL"></g></g>
    </svg>
    <textarea id="editor" hidden spellcheck="false"></textarea>
    <div class="hint" id="hint"></div>
  </main>

  <aside class="panel" id="panel" aria-label="屬性"></aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-labelledby="mTitle">
    <div class="row"><h2 id="mTitle">匯出 / 匯入</h2><span class="sp"></span><button class="btn icon" id="mClose" title="關閉">✕</button></div>
    <div class="seg" id="mTabs">
      <button data-tab="json" class="on">JSON 資料</button>
      <button data-tab="svg">SVG 向量圖</button>
      <button data-tab="png">PNG 圖片</button>
    </div>
    <textarea id="mText" spellcheck="false"></textarea>
    <img id="mImg" alt="流程圖 PNG 預覽" hidden>
    <p class="note" id="mNote"></p>
    <div class="row">
      <button class="btn outline" id="mCopy">複製</button>
      <button class="btn outline" id="mDownload">下載檔案</button>
      <span class="sp"></span>
      <label class="btn outline filebtn" id="mFileWrap">開啟 .json 檔<input type="file" id="mFile" accept=".json,application/json"></label>
      <button class="btn primary" id="mApply">套用上方 JSON</button>
    </div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const GRID = 10;
const FONT = '"Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif';
const STORE = 'flowboard.v1';
const SIDES = ['top','right','bottom','left'];

const app=$('#app'), svg=$('#svg'), world=$('#world'), edgesL=$('#edgesL'), nodesL=$('#nodesL'), overL=$('#overlayL');
const panel=$('#panel'), editor=$('#editor'), hint=$('#hint'), stage=$('#stage');

/* ---------- palette (theme-aware via CSS vars, literal colors for export) ---------- */
const PALETTE = {
  default:{name:'預設', lf:'#fffdf8', ls:'#3b332b', df:'#2a2520', ds:'#b9ad9c'},
  blue:   {name:'藍',   lf:'#e5ecff', ls:'#3358d4', df:'#1e2948', ds:'#86a1ff'},
  green:  {name:'綠',   lf:'#e2f4e9', ls:'#2a8a55', df:'#1a3125', ds:'#62cf91'},
  amber:  {name:'黃',   lf:'#fff2d4', ls:'#b2761c', df:'#372d16', ds:'#e8b452'},
  rose:   {name:'紅',   lf:'#fde5ea', ls:'#c43c5a', df:'#3b1e26', ds:'#f2829a'},
  violet: {name:'紫',   lf:'#eee6fd', ls:'#6f45c9', df:'#2b2244', ds:'#b598ff'},
  slate:  {name:'灰',   lf:'#ece6db', ls:'#6b6156', df:'#2e2924', ds:'#a89c8c'},
};
(() => {
  let L='', Dk='';
  for (const [k,p] of Object.entries(PALETTE)) { L+=`--${k}-f:${p.lf};--${k}-s:${p.ls};`; Dk+=`--${k}-f:${p.df};--${k}-s:${p.ds};`; }
  const st=document.createElement('style');
  st.textContent=`:root{${L}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${Dk}}}:root[data-theme="dark"]{${Dk}}`;
  document.head.appendChild(st);
})();
let exporting=false;
const fillOf = k => exporting ? PALETTE[k].lf : `var(--${k}-f)`;
const strokeOf = k => exporting ? PALETTE[k].ls : `var(--${k}-s)`;
const inkC = () => exporting ? '#2b2520' : 'var(--ink)';
const bgC = () => exporting ? '#ffffff' : 'var(--canvas)';

/* ---------- shapes & tools ---------- */
const SHAPES = {
  rect:   {name:'流程',     w:140,h:60, key:'r'},
  round:  {name:'開始/結束', w:140,h:50, key:'o'},
  diamond:{name:'判斷',     w:150,h:90, key:'d'},
  para:   {name:'輸入/輸出', w:150,h:60, key:'p'},
  doc:    {name:'文件',     w:140,h:70, key:'f'},
  ellipse:{name:'圓形',     w:120,h:70, key:'e'},
  text:   {name:'文字',     w:140,h:30, key:'t'},
};
const ic = inner => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICON = {
  select: ic('<path d="M5 3l13 7.5-5.5 1.6L10 18z"/>'),
  hand:   ic('<path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/>'),
  rect:   ic('<rect x="3.5" y="6.5" width="17" height="11" rx="1.2"/>'),
  round:  ic('<rect x="2.5" y="7" width="19" height="10" rx="5"/>'),
  diamond:ic('<path d="M12 3l9 9-9 9-9-9z"/>'),
  para:   ic('<path d="M7.5 6.5h13l-4 11h-13z"/>'),
  doc:    ic('<path d="M4 4.5h16V17c-4-2.6-8 2.6-16 0z"/>'),
  ellipse:ic('<ellipse cx="12" cy="12" rx="9" ry="6.5"/>'),
  text:   ic('<path d="M5 7V5h14v2M12 5v14M9 19h6"/>'),
  arrow:  ic('<path d="M4 20L19 5M11 5h8v8"/>'),
  line:   ic('<path d="M4 20L20 4"/>'),
};
const TOOLS = [
  ['select','選取','v'],['hand','平移畫布','h'],null,
  ...Object.entries(SHAPES).map(([k,s])=>[k,s.name,s.key]),null,
  ['arrow','箭頭','a'],['line','線條','l'],
];
const HINTS = {
  select:'拖曳圖形邊上的小圓點拉出箭頭 · 雙擊圖形改文字 · 雙擊空白處新增方框 · 按住空白鍵拖曳可平移',
  hand:'拖曳來平移畫布 · 觸控板捲動也能平移，⌘/Ctrl＋滾輪縮放',
  arrow:'從一個圖形拖到另一個圖形，放在空白處會留下自由端點',
  line:'拖曳畫出一條沒有箭頭的線，可接在圖形上',
};

/* ---------- state ---------- */
let D = {nodes:[], edges:[]};
let view = {x:0, y:0, k:1};
let sel = new Set();
let tool = 'select';
let hoverId = null;
let drag = null;
let editing = null, editPre = null;
let undoS = [], redoS = [];
let clip = null, clipN = 0;
let spaceDown = false;

const uid = p => p + Math.random().toString(36).slice(2,8);
const snap = v => Math.round(v/GRID)*GRID;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const num = (v,d) => Number.isFinite(+v) && v !== null && v !== '' ? +v : d;
const isN = it => it && 'type' in it;
const nodeById = id => D.nodes.find(n => n.id === id);
const byId = id => nodeById(id) || D.edges.find(e => e.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mk(tag, attrs={}, kids=[]) {
  const el = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) if (v !== undefined && v !== null) el.setAttribute(k, v);
  kids.forEach(c => c && el.appendChild(c));
  return el;
}

/* ---------- history & persistence ---------- */
const snapshot = () => JSON.stringify(D);
function save(){ try { localStorage.setItem(STORE, snapshot()); } catch(_){} }
function pushUndo(pre){
  if (pre === snapshot()) return;
  undoS.push(pre); if (undoS.length > 150) undoS.shift();
  redoS = []; save(); syncHistoryBtns();
}
function mutate(fn){ const pre = snapshot(); fn(); pushUndo(pre); render(); }
function pruneSel(){ sel = new Set([...sel].filter(id => byId(id))); }

function wrap(text, max, size){

    let line = '';
    for (const t of toks) {
      const test = line + t;
      if (line && measure(test.trimEnd(), size) > max) { out.push(line.trimEnd()); line = t.trimStart(); }
      else line = test;
    }
    out.push(line.trimEnd());

  return out;

/* ---------- rendering ---------- */
function shapeEl(n){

    case 'diamond': el = mk('polygon',{points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`}); break;

function renderView(){

function render(){

function renderOverlay(){

    const n = nodeById(id); if (!n) continue;

    const n = single, s = 8/k, p = 5/k;

    const n = nodeById(id);

      out.push(mk('rect',{class:'hotnode', x:n.x-3/k, y:n.y-3/k, width:n.w+6/k, height:n.h+6/k, rx:4/k, 'stroke-width':2/k}));

panel.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;

    case 'ncolor': set(() => ns.forEach(n => n.color = v)); break;
    case 'ecolor': set(() => es.forEach(e => e.color = v)); break;
    case 'shape': set(() => ns.forEach(n => n.type = v)); break;
    case 'fs': set(() => ns.forEach(n => n.fontSize = +v)); break;
    case 'route': set(() => es.forEach(e => e.route = v)); break;
    case 'arrow': set(() => es.forEach(e => { e.arrowEnd = v !== 'none'; e.arrowStart = v === 'both'; })); break;

    case 'back': set(() => { D.nodes = [...D.nodes.filter(n => sel.has(n.id)), ...D.nodes.filter(n => !sel.has(n.id))]; }); break;

/* ---------- commands ---------- */
function deleteSel(){
  if (!sel.size) return;
  mutate(() => {
    D.nodes = D.nodes.filter(n => !sel.has(n.id));
    const alive = new Set(D.nodes.map(n => n.id));
    D.edges = D.edges.filter(e => !sel.has(e.id) && (e.from.node == null || alive.has(e.from.node)) && (e.to.node == null || alive.has(e.to.node)));
    sel.clear();

}
function copySel(){
  const ns = D.nodes.filter(n => sel.has(n.id)), ids = new Set(ns.map(n => n.id));
  const ok = ep => ep.node == null || ids.has(ep.node);
  const es = D.edges.filter(e => (sel.has(e.id) || (ids.has(e.from.node) && ids.has(e.to.node))) && ok(e.from) && ok(e.to));
  if (!ns.length && !es.length) return false;

}
function paste(){

    const nn = clip.nodes.map(n => { const id = uid('n'); map.set(n.id, id); return {...n, id, x:n.x+off, y:n.y+off}; });
    const ne = clip.edges.map(e => {

function autoLayout(){

  D.edges.forEach(e => { const a = e.from.node, b = e.to.node; if (inSet.has(a) && inSet.has(b) && a !== b) { out.get(a).push(b); indeg.set(b, indeg.get(b)+1); } });

}

/* ---------- import / export ---------- */
function normalize(d){
  const nodes = (d && Array.isArray(d.nodes) ? d.nodes : []).map((n,i) => {
    const type = SHAPES[n.type] ? n.type : 'rect', def = SHAPES[type];
    return {id:String(n.id ?? uid('n')), type, x:num(n.x,0), y:num(n.y,i*110), w:Math.max(20,num(n.w,def.w)), h:Math.max(16,num(n.h,def.h)),
      text:String(n.text ?? ''), color:PALETTE[n.color] ? n.color : 'default', fontSize:num(n.fontSize,14)};
  });
  const ids = new Set(nodes.map(n => n.id));
  const ep = v => {
    if (typeof v === 'string' || typeof v === 'number') return ids.has(String(v)) ? {node:String(v)} : null;
    if (v && v.node != null) return ids.has(String(v.node)) ? (SIDES.includes(v.side) ? {node:String(v.node), side:v.side} : {node:String(v.node)}) : null;
    if (v && Number.isFinite(+v.x) && Number.isFinite(+v.y)) return {x:+v.x, y:+v.y};
    return null;
  };
  const edges = (d && Array.isArray(d.edges) ? d.edges : []).map(e => {
    const from = ep(e.from), to = ep(e.to); if (!from || !to) return null;
    return {id:String(e.id ?? uid('e')), from, to, label:String(e.label ?? ''), route:e.route === 'straight' ? 'straight' : 'elbow',
      arrowEnd:e.arrowEnd !== false, arrowStart:!!e.arrowStart, dashed:!!e.dashed, color:PALETTE[e.color] ? e.color : 'default'};
  }).filter(Boolean);
  return {nodes, edges};
}
function exportSVG(){
  const b = bounds() || {x:0, y:0, w:100, h:60}, pad = 30;
  exporting = true;
  const es = D.edges.map(e => edgeEl(e)), ns = D.nodes.map(nodeEl);
  exporting = false;
  const W = Math.ceil(b.w+pad*2), H = Math.ceil(b.h+pad*2);
  const root = mk('svg', {xmlns:NS, width:W, height:H, viewBox:`${b.x-pad} ${b.y-pad} ${W} ${H}`});
  root.appendChild(mk('rect', {x:b.x-pad, y:b.y-pad, width:W, height:H, fill:'#ffffff'}));
  root.appendChild(mk('g', {}, es)); root.appendChild(mk('g', {}, ns));
  root.querySelectorAll('[pointer-events]').forEach(el => el.removeAttribute('pointer-events'));
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(root);
}
function exportPNG(){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = img.width*2; c.height = img.height*2;
      const x = c.getContext('2d'); x.scale(2,2); x.drawImage(img, 0, 0); res(c.toDataURL('image/png'));
    };
    img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(exportSVG());
  });
}
function download(name, href){ const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }

const modal = $('#modal'), mText = $('#mText'), mImg = $('#mImg'), mNote = $('#mNote');

/* ---------- keyboard ---------- */

Object.entries(SHAPES).forEach(([k,s]) => KEYTOOL[s.key] = k);

  if (ev.key === 'Enter' && sel.size === 1) { ev.preventDefault(); startEdit([...sel][0]); return; }
  if (ev.key === '!' || (ev.shiftKey && ev.code === 'Digit1')) { fit(); return; }
  const arrows = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]};
  if (arrows[ev.key] && sel.size) {
    ev.preventDefault(); const [dx,dy] = arrows[ev.key].map(v => v*(ev.shiftKey ? GRID*5 : GRID));
    mutate(() => [...sel].map(byId).forEach(it => {
      if (isN(it)) { it.x += dx; it.y += dy; }
      else ['from','to'].forEach(k => { if (it[k].node == null) it[k] = {x:it[k].x+dx, y:it[k].y+dy}; });
    }));
    return;
  }
  if (!mod && !ev.altKey && KEYTOOL[key]) setTool(KEYTOOL[key]);
});
document.addEventListener('keyup', ev => { if (ev.key === ' ') { spaceDown = false; svg.classList.remove('panning'); } });

/* ---------- public API (the surface a future MCP server will drive) ---------- */
function freeSpot(w, h){ const b = bounds(); return b ? {x:snap(b.x + b.w/2 - w/2), y:snap(b.y + b.h + 60)} : {x:snap(-w/2), y:0}; }
window.flowboard = {
  version: 1,
  shapes: Object.keys(SHAPES),
  colors: Object.keys(PALETTE),
  getDiagram: () => JSON.parse(snapshot()),
  setDiagram: d => { mutate(() => { D = normalize(d); sel.clear(); }); selChanged(); fit(); },
  addNode: (o = {}) => {
    const type = SHAPES[o.type] ? o.type : 'rect', def = SHAPES[type], w = num(o.w, def.w), h = num(o.h, def.h);
    const spot = (o.x == null || o.y == null) ? freeSpot(w, h) : {x:+o.x, y:+o.y};
    const n = normalize({nodes:[{...o, type, w, h, ...spot, id:o.id ?? uid('n')}]}).nodes[0];
    mutate(() => D.nodes.push(n)); renderPanel(); return n.id;
  },
  addEdge: (from, to, o = {}) => {
    const e = normalize({nodes:D.nodes, edges:[{...o, from, to, id:o.id ?? uid('e')}]}).edges[0];
    if (!e) throw new Error('from/to 必須是現有圖形的 id，或 {x, y} 座標');
    mutate(() => D.edges.push(e)); renderPanel(); return e.id;
  },
  update: (id, patch) => { const it = byId(id); if (!it) return false; mutate(() => { Object.assign(it, patch); D = normalize(D); }); renderPanel(); return true; },
  remove: id => { sel = new Set([id]); deleteSel(); },
  clear: () => { mutate(() => { D = {nodes:[], edges:[]}; sel.clear(); }); selChanged(); },
  autoLayout, fit, exportSVG, exportPNG, undo, redo,
};

/* ---------- boot ---------- */
if (window.top === window.self) $('#backLink').hidden = false;
window.addEventListener('storage', ev => { if (ev.key === 'theme' && ev.newValue) { document.documentElement.dataset.theme = ev.newValue; render(); } });
const SAMPLE = {
  nodes: [
    {id:'start', type:'round', x:-70, y:0, w:140, h:50, text:'開始', color:'green'},
    {id:'recv', type:'rect', x:-70, y:100, w:140, h:60, text:'接收訂單', color:'default'},
    {id:'stock', type:'diamond', x:-80, y:210, w:160, h:100, text:'庫存充足？', color:'amber'},
    {id:'pay', type:'para', x:-90, y:370, w:180, h:60, text:'輸入付款資料', color:'blue'},
    {id:'ship', type:'rect', x:-70, y:480, w:140, h:60, text:'安排出貨', color:'default'},
    {id:'end', type:'round', x:-70, y:590, w:140, h:50, text:'結束', color:'slate'},
    {id:'notify', type:'doc', x:180, y:225, w:150, h:70, text:'通知補貨', color:'rose'},
    {id:'cs', type:'ellipse', x:190, y:370, w:130, h:70, text:'客服聯繫客戶', color:'violet'},
    {id:'note', type:'text', x:-360, y:110, w:220, h:60, text:'這是範例圖，可直接拖曳修改\n或按上方「清空」重新開始', fontSize:13},
  ],
  edges: [
    {from:'start', to:'recv'}, {from:'recv', to:'stock'},
    {from:'stock', to:'pay', label:'是'},
    {from:{node:'stock', side:'right'}, to:{node:'notify', side:'left'}, label:'否'},
    {from:{node:'notify', side:'top'}, to:{node:'recv', side:'right'}, label:'補貨完成'},
    {from:{node:'notify', side:'bottom'}, to:{node:'cs', side:'top'}, dashed:true, color:'violet'},
    {from:'pay', to:'ship'}, {from:'ship', to:'end'},
  ],
};
let loaded = null;
try { const s = localStorage.getItem(STORE); if (s) loaded = JSON.parse(s); } catch(_) {}
D = normalize(loaded && (loaded.nodes?.length || loaded.edges?.length) ? loaded : SAMPLE);
setTool('select'); syncHistoryBtns(); render(); selChanged();
requestAnimationFrame(fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(renderOverlay, 100); });
})();
</script>
