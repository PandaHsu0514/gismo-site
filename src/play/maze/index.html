<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>迷宮</title>
  <link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
  <div class="wrap">
    <div class="bar"><span>第 <b id="score">0</b> 層</span><span>剩 <b id="time">60</b> 秒</span><span>最深 <b id="best">0</b> 層</span></div>
    <div class="stage"><canvas id="c" width="440" height="440"></canvas><div class="ov" id="ov"></div></div>
    <div class="pad" id="pad"></div>
    <p class="help">方向鍵或滑動走到右下角的出口。每過一層加 10 秒，迷宮也會變大</p>
  </div>
  <script src="../kit/kit.js"></script>
  <script>
    var cv = K.$("c"), ctx = cv.getContext("2d"), SZ = 440;
    var hud = K.hud("maze-best"), n, cells, me, level, timeLeft, playing = false, trail;
    K.pad([["◀", "ArrowLeft"], ["▲", "ArrowUp"], ["▼", "ArrowDown"], ["▶", "ArrowRight"]]);
    // 每格記錄四面牆：1 上 2 右 4 下 8 左
    function gen(size) {
      n = size; cells = Array(n * n).fill(15);
      var seen = Array(n * n).fill(false), stack = [0]; seen[0] = true;
      while (stack.length) {
        var c = stack[stack.length - 1], x = c % n, y = c / n | 0, opts = [];
        if (y > 0 && !seen[c - n]) opts.push([c - n, 1, 4]); if (x < n - 1 && !seen[c + 1]) opts.push([c + 1, 2, 8]);
        if (y < n - 1 && !seen[c + n]) opts.push([c + n, 4, 1]); if (x > 0 && !seen[c - 1]) opts.push([c - 1, 8, 2]);
        if (!opts.length) { stack.pop(); continue; }
        var o = K.pick(opts); cells[c] &= ~o[1]; cells[o[0]] &= ~o[2]; seen[o[0]] = true; stack.push(o[0]);
      }
      me = 0; trail = [0];
    }
    function next() { level++; hud.set(level - 1); gen(Math.min(5 + level * 2, 31)); }
    function start() { level = 0; timeLeft = 60; playing = true; next(); }
    function move(dx, dy) {
      if (!playing) return;
      var wall = dx > 0 ? 2 : dx < 0 ? 8 : dy > 0 ? 4 : 1;
      if (cells[me] & wall) return;
      me += dx + dy * n; trail.push(me); K.beep(600, 0.02, "sine", 0.03);
      if (me === n * n - 1) { timeLeft += 10; K.beep(990, 0.2); next(); }
    }
    addEventListener("keydown", function (e) {
      var d = { ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0], ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1] }[e.key];
      if (d) move(d[0], d[1]);
    });
    K.swipe(cv, function (d) { // 滑動會一路走到岔路為止
      var dx = d === "left" ? -1 : d === "right" ? 1 : 0, dy = d === "up" ? -1 : d === "down" ? 1 : 0, wall = dx > 0 ? 2 : dx < 0 ? 8 : dy > 0 ? 4 : 1;
      var guard = 0;
      do { var before = me; move(dx, dy); if (me === before || me === 0) break; var openCount = [1, 2, 4, 8].filter(function (w) { return !(cells[me] & w); }).length; } while (++guard < 50 && openCount === 2 && !(cells[me] & wall));
    });
    K.loop(function (dt) {
      if (playing) {
        timeLeft -= dt; K.$("time").textContent = Math.max(0, Math.ceil(timeLeft));
        if (timeLeft <= 0) { playing = false; var s = level - 1, nb = hud.finish(s); K.show(nb ? "新紀錄！" : "時間到", "走過了 " + s + " 層迷宮", "再挑戰", start); }
      }
      draw();
    });
    function draw() {
      ctx.clearRect(0, 0, SZ, SZ); if (!cells) return;
      var s = SZ / n;
      ctx.fillStyle = K.c("accent2"); ctx.globalAlpha = 0.6; ctx.fillRect((n - 1) * s + 2, (n - 1) * s + 2, s - 4, s - 4); ctx.globalAlpha = 1;
      ctx.strokeStyle = K.c("gold"); ctx.lineWidth = Math.max(2, s / 5); ctx.lineCap = ctx.lineJoin = "round"; ctx.globalAlpha = 0.5; ctx.beginPath();
      trail.forEach(function (c, i) { ctx[i ? "lineTo" : "moveTo"]((c % n + 0.5) * s, ((c / n | 0) + 0.5) * s); }); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.strokeStyle = K.c("text"); ctx.lineWidth = 2; ctx.lineCap = "square"; ctx.beginPath();
      for (var i = 0; i < n * n; i++) {
        var x = (i % n) * s, y = (i / n | 0) * s, w = cells[i];
        if (w & 1) { ctx.moveTo(x, y); ctx.lineTo(x + s, y); } if (w & 2) { ctx.moveTo(x + s, y); ctx.lineTo(x + s, y + s); }
        if (w & 4) { ctx.moveTo(x, y + s); ctx.lineTo(x + s, y + s); } if (w & 8) { ctx.moveTo(x, y); ctx.lineTo(x, y + s); }
      }
      ctx.stroke();
      ctx.fillStyle = K.c("accent"); ctx.beginPath(); ctx.arc((me % n + 0.5) * s, ((me / n | 0) + 0.5) * s, s * 0.3, 0, 7); ctx.fill();
    }
    K.show("迷宮", "60 秒內盡量走過越多層越好。\n手機滑一下會一路走到岔路口。", "開始", start);
  </script>
</body>
</html>
