<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>乒乓對打</title>
  <link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
  <div class="wrap">
    <div class="bar"><span>你 <b id="me">0</b></span><span>先得 7 分獲勝・連勝 <b id="score">0</b></span><span>電腦 <b id="ai">0</b></span></div>
    <div class="stage"><canvas id="c" width="400" height="560"></canvas><div class="ov" id="ov"></div></div>
    <div class="controls" id="lv"><button type="button" data-l="0">簡單</button><button type="button" data-l="1" class="ghost">普通</button><button type="button" data-l="2" class="ghost">困難</button></div>
    <p class="help">滑鼠或手指左右移動下方球拍；鍵盤用 ← →。最高連勝 <b id="best">0</b></p>
  </div>
  <script src="../kit/kit.js"></script>
  <script>
    var cv = K.$("c"), ctx = cv.getContext("2d"), W = cv.width, H = cv.height;
    var hud = K.hud("pong-streak"), P = K.pointer(cv), lastPX = null, streak = 0;
    var me, ai, ball, sMe, sAi, playing = false, serveT, lv = 0, AISPEED = [220, 330, 460];
    K.$("lv").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return; lv = +b.dataset.l;
      this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("ghost", x !== b); });
    });
    function serve(dir) { ball = { x: W / 2, y: H / 2, r: 7, vx: K.rand(-120, 120), vy: 0, dir: dir }; serveT = 0.8; }
    function start() { me = { x: W / 2 - 40, y: H - 28, w: 80, h: 10 }; ai = { x: W / 2 - 40, y: 18, w: 80, h: 10 }; sMe = sAi = 0; ui(); serve(1); playing = true; }
    function ui() { K.$("me").textContent = sMe; K.$("ai").textContent = sAi; }
    function bounce(p, down) {
      var off = K.clamp((ball.x - (p.x + p.w / 2)) / (p.w / 2), -1, 1), sp = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 900);
      ball.vx = sp * Math.sin(off); ball.vy = (down ? 1 : -1) * sp * Math.cos(off) ; K.beep(down ? 330 : 440, 0.05, "square", 0.04);
    }
    function update(dt) {
      if (K.left()) me.x -= 480 * dt; else if (K.right()) me.x += 480 * dt; else if (P.active && P.x !== lastPX) me.x = P.x - me.w / 2;
      lastPX = P.x; me.x = K.clamp(me.x, 0, W - me.w);
      // 電腦：追著球跑，但有速度上限
      var target = ball.vy < 0 ? ball.x - ai.w / 2 + Math.sin(Date.now() / 300) * (2 - lv) * 14 : W / 2 - ai.w / 2;
      var d = target - ai.x, m = AISPEED[lv] * dt; ai.x += K.clamp(d, -m, m); ai.x = K.clamp(ai.x, 0, W - ai.w);
      if (serveT > 0) { serveT -= dt; if (serveT <= 0) ball.vy = ball.dir * 300; return; }
      var n = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 5);
      for (var i = 0; i < n; i++) {
        ball.x += ball.vx * dt / n; ball.y += ball.vy * dt / n;
        if (ball.x < ball.r || ball.x > W - ball.r) { ball.vx = -ball.vx; ball.x = K.clamp(ball.x, ball.r, W - ball.r); }
        if (ball.vy > 0 && ball.y + ball.r >= me.y && ball.y < me.y + me.h && ball.x > me.x - ball.r && ball.x < me.x + me.w + ball.r) bounce(me, false);
        if (ball.vy < 0 && ball.y - ball.r <= ai.y + ai.h && ball.y > ai.y && ball.x > ai.x - ball.r && ball.x < ai.x + ai.w + ball.r) bounce(ai, true);
      }
      if (ball.y > H + 20) { sAi++; ui(); K.beep(150, 0.2); serve(1); }
      if (ball.y < -20) { sMe++; ui(); K.beep(900, 0.2); serve(-1); }
      if (sMe >= 7 || sAi >= 7) {
        playing = false; var win = sMe >= 7;
        streak = win ? streak + 1 : 0; hud.set(streak); var nb = win && hud.finish(streak);
        K.show(win ? (nb ? "新的連勝紀錄！" : "你贏了！") : "電腦贏了", sMe + " : " + sAi + (win ? "\n目前連勝 " + streak + " 場" : ""), "再來一局", start);
      }
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = K.c("line"); ctx.setLineDash([10, 10]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = K.c("line"); ctx.font = "900 80px serif"; ctx.textAlign = "center";
      ctx.fillText(sAi || 0, W / 2, H / 2 - 40); ctx.fillText(sMe || 0, W / 2, H / 2 + 100);
      if (!me) return;
      ctx.fillStyle = K.c("text"); ctx.beginPath(); ctx.roundRect(me.x, me.y, me.w, me.h, 5); ctx.fill();
      ctx.fillStyle = K.c("blue"); ctx.beginPath(); ctx.roundRect(ai.x, ai.y, ai.w, ai.h, 5); ctx.fill();
      ctx.fillStyle = K.c("accent"); ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill();
    }
    K.loop(function (dt) { if (playing) update(dt); draw(); });
    K.show("乒乓對打", "跟電腦對打，先拿 7 分的贏。\n用球拍邊緣打可以打出斜角。", "開始", start);
  </script>
</body>
</html>
