<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>2048</title>
  <link rel="stylesheet" href="../kit/kit.css">
<style>
  .board { grid-template-columns: repeat(4, 1fr); background: var(--line); padding: 8px; border-radius: 12px; gap: 8px; position: relative; }
  .cell { cursor: default; font-size: clamp(20px, 7vw, 34px); background: var(--board); }
  .cell.pop { animation: pop .15s; }
  @keyframes pop { 50% { transform: scale(1.12); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar"><span>分數 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div>
    <div class="stage"><div class="board" id="b"></div><div class="ov" id="ov" hidden></div></div>
    <div class="controls"><button type="button" class="ghost" id="new">重新開始</button></div>
    <p class="help">方向鍵或滑動，相同數字會合併。湊出 2048！</p>
  </div>
  <script src="../kit/kit.js"></script>
  <script>
    var hud = K.hud("2048-best"), el = K.$("b"), grid, score, won, cells = [];
    for (var i = 0; i < 16; i++) { var d = document.createElement("div"); d.className = "cell"; el.appendChild(d); cells.push(d); }
    var COLORS = { 2: ["surface", "text"], 4: ["line", "text"], 8: ["gold", "bg"], 16: ["gold", "bg"], 32: ["accent", "bg"], 64: ["accent", "bg"], 128: ["accent2", "bg"], 256: ["accent2", "bg"], 512: ["blue", "bg"], 1024: ["blue", "bg"], 2048: ["purple", "bg"] };
    function add() {
      var empty = []; grid.forEach(function (v, i) { if (!v) empty.push(i); });
      if (empty.length) { var i = K.pick(empty); grid[i] = Math.random() < 0.9 ? 2 : 4; return i; }
    }
    function start() { grid = Array(16).fill(0); score = 0; won = false; hud.set(0); add(); add(); render(); K.hide(); }
    function render(pops) {
      grid.forEach(function (v, i) {
        var c = cells[i], col = COLORS[v] || ["purple", "bg"];
        c.textContent = v || ""; c.style.background = v ? K.c(col[0]) : ""; c.style.color = K.c(col[1]);
        c.style.fontSize = v >= 1024 ? "clamp(16px, 5vw, 26px)" : "";
        c.classList.remove("pop"); if (pops && pops.indexOf(i) >= 0) { void c.offsetWidth; c.classList.add("pop"); }
      });
    }
    function line(idx) {
      var vals = idx.map(function (i) { return grid[i]; }).filter(Boolean), out = [], merged = [];
      for (var k = 0; k < vals.length; k++) {
        if (vals[k] === vals[k + 1]) { out.push(vals[k] * 2); score += vals[k] * 2; merged.push(idx[out.length - 1]); k++; }
        else out.push(vals[k]);
      }
      while (out.length < 4) out.push(0);
      var changed = false;
      idx.forEach(function (i, n) { if (grid[i] !== out[n]) changed = true; grid[i] = out[n]; });
      return { changed: changed, merged: merged };
    }
    function move(dir) {
      if (!grid || !K.$("ov").hidden) return;
      var changed = false, pops = [];
      for (var a = 0; a < 4; a++) {
        var idx = [];
        for (var b = 0; b < 4; b++) {
          if (dir === "left") idx.push(a * 4 + b); if (dir === "right") idx.push(a * 4 + 3 - b);
          if (dir === "up") idx.push(b * 4 + a); if (dir === "down") idx.push((3 - b) * 4 + a);
        }
        var r = line(idx); changed = changed || r.changed; pops = pops.concat(r.merged);
      }
      if (!changed) return;
      pops.push(add()); hud.set(score); render(pops);
      if (!won && grid.indexOf(2048) >= 0) { won = true; hud.finish(score); K.show("湊到 2048 了！", "要繼續挑戰更大的數字嗎？", "繼續玩", function () {}); return; }
      if (!canMove()) { var nb = hud.finish(score); K.show(nb ? "新紀錄！" : "沒有步可以走了", "得分 " + score, "再玩一次", start); }
    }
    function canMove() {
      for (var i = 0; i < 16; i++) {
        if (!grid[i]) return true;
        if (i % 4 < 3 && grid[i] === grid[i + 1]) return true;
        if (i < 12 && grid[i] === grid[i + 4]) return true;
      }
      return false;
    }
    addEventListener("keydown", function (e) {
      var d = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down" }[e.key];
      if (d) { e.preventDefault(); move(d); }
    });
    K.swipe(el, move);
    K.$("new").onclick = start;
    start();
  </script>
</body>
</html>
