<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>記憶翻牌</title>
  <link rel="stylesheet" href="../kit/kit.css">
<style>
  .board { grid-template-columns: repeat(4, 1fr); gap: 10px; width: min(100%, 420px, calc(100vh - 160px)); }
  .card { aspect-ratio: 1; perspective: 600px; cursor: pointer; }
  .card .in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
  .card.flip .in, .card.done .in { transform: rotateY(180deg); }
  .card .f, .card .b { position: absolute; inset: 0; border-radius: 10px; display: grid; place-items: center; backface-visibility: hidden; }
  .card .f { background: var(--accent); color: var(--bg); font: 900 22px "Noto Serif TC", serif; }
  .card .b { background: var(--surface); border: 2px solid var(--line); transform: rotateY(180deg); font-size: clamp(28px, 10vw, 48px); }
  .card.done .b { border-color: var(--accent2); opacity: .7; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar"><span>步數 <b id="score">0</b></span><span>配對 <b id="pairs">0</b>/8</span><span>最少 <b id="best">—</b></span></div>
    <div class="stage"><div class="board" id="b"></div><div class="ov" id="ov" hidden></div></div>
    <div class="controls"><button type="button" class="ghost" id="new">重新洗牌</button></div>
    <p class="help">一次翻兩張，找出相同的圖案。步數越少越好</p>
  </div>
  <script src="../kit/kit.js"></script>
  <script>
    var POOL = ["🍎", "🍋", "🍇", "🐼", "🐢", "🦊", "🌵", "🚲", "⛵", "🎈", "🍄", "🐙", "🌙", "⚽", "🎸", "🦉"];
    var hud = K.hud("memory-best", { low: true }), el = K.$("b"), open, moves, pairs, lock;
    function start() {
      var faces = K.shuffle(POOL.slice()).slice(0, 8); faces = K.shuffle(faces.concat(faces));
      el.innerHTML = ""; open = []; moves = 0; pairs = 0; lock = false; hud.set(0); K.$("pairs").textContent = 0;
      faces.forEach(function (f) {
        var c = document.createElement("div"); c.className = "card"; c.dataset.f = f;
        c.innerHTML = '<div class="in"><div class="f">講</div><div class="b">' + f + "</div></div>";
        el.appendChild(c);
      });
      K.hide();
    }
    el.addEventListener("click", function (e) {
      var c = e.target.closest(".card");
      if (!c || lock || c.classList.contains("flip") || c.classList.contains("done")) return;
      c.classList.add("flip"); open.push(c); K.beep(500, 0.05);
      if (open.length < 2) return;
      moves++; hud.set(moves);
      if (open[0].dataset.f === open[1].dataset.f) {
        open.forEach(function (x) { x.classList.add("done"); }); open = []; pairs++; K.$("pairs").textContent = pairs; K.beep(880, 0.12);
        if (pairs === 8) { var nb = hud.finish(moves); setTimeout(function () { K.show(nb ? "新紀錄！" : "全部配對成功", "用了 " + moves + " 步", "再玩一次", start); }, 500); }
      } else {
        lock = true;
        setTimeout(function () { open.forEach(function (x) { x.classList.remove("flip"); }); open = []; lock = false; }, 800);
      }
    });
    K.$("new").onclick = start;
    start();
  </script>
</body>
</html>
