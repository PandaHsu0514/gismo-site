<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>隕石帶</title>
  <link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
  <div class="wrap">
    <div class="bar"><span>分數 <b id="score">0</b></span><span>第 <b id="wave">1</b> 波・生命 <b id="lives">3</b></span><span>最高 <b id="best">0</b></span></div>
    <div class="stage"><canvas id="c" width="480" height="480"></canvas><div class="ov" id="ov"></div></div>
    <div class="pad" id="pad"></div>
    <p class="help">← → 轉向，↑ 推進，空白鍵射擊。飛出邊界會從另一邊回來</p>
  </div>
  <script src="../kit/kit.js"></script>
  <script>
    var cv = K.$("c"), ctx = cv.getContext("2d"), W = cv.width, H = cv.height;
    var hud = K.hud("asteroids-best");
    var ship, rocks, shots, bits, score, lives, wave, inv, cool, playing = false;
    K.pad([["⟲", "ArrowLeft"], ["▲", "ArrowUp"], ["●", " "], ["⟳", "ArrowRight"]]);

    function rock(x, y, size) {
      var n = 10, pts = [];
      for (var i = 0; i < n; i++) pts.push(K.rand(0.7, 1.1));
      var a = K.rand(0, 7), sp = K.rand(30, 70) * (4 - size) * 0.6;
      return { x: x, y: y, r: [0, 14, 26, 44][size], size: size, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: 0, vr: K.rand(-1, 1), pts: pts };
    }
    function newWave() {
      rocks = [];
      for (var i = 0; i < 3 + wave; i++) {
        var x, y; do { x = K.rand(0, W); y = K.rand(0, H); } while (Math.hypot(x - ship.x, y - ship.y) < 140);
        rocks.push(rock(x, y, 3));
      }
    }
    function start() {
      ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0 }; shots = []; bits = [];
      score = 0; lives = 3; wave = 1; inv = 2; cool = 0; hud.set(0); newWave(); playing = true; ui();
    }
    function ui() { K.$("lives").textContent = lives; K.$("wave").textContent = wave; }
    function wrap(o) { if (o.x < 0) o.x += W; if (o.x > W) o.x -= W; if (o.y < 0) o.y += H; if (o.y > H) o.y -= H; }
    function burst(x, y, n) { for (var i = 0; i < n; i++) { var a = K.rand(0, 7), s = K.rand(40, 160); bits.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: K.rand(0.3, 0.8) }); } }

    function update(dt) {
      inv -= dt; cool -= dt;
      if (K.left()) ship.a -= 4 * dt;
      if (K.right()) ship.a += 4 * dt;
      ship.thrust = K.up();
      if (ship.thrust) { ship.vx += Math.cos(ship.a) * 260 * dt; ship.vy += Math.sin(ship.a) * 260 * dt; }
      ship.vx *= Math.pow(0.6, dt); ship.vy *= Math.pow(0.6, dt);
      ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
      if (K.keys[" "] && cool <= 0) {
        cool = 0.22;
        shots.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14, vx: Math.cos(ship.a) * 420 + ship.vx, vy: Math.sin(ship.a) * 420 + ship.vy, life: 1 });
        K.beep(700, 0.05, "square", 0.03);
      }
      shots.forEach(function (s) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; wrap(s); });
      rocks.forEach(function (r) { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; wrap(r); });
      shots = shots.filter(function (s) {
        if (s.life <= 0) return false;
        for (var i = 0; i < rocks.length; i++) {
          var r = rocks[i];
          if (Math.hypot(s.x - r.x, s.y - r.y) < r.r) {
            rocks.splice(i, 1); burst(r.x, r.y, 8);
            score += [0, 100, 50, 20][r.size]; hud.set(score); K.beep(160 + r.size * 40, 0.1, "sawtooth", 0.05);
            if (r.size > 1) { rocks.push(rock(r.x, r.y, r.size - 1)); rocks.push(rock(r.x, r.y, r.size - 1)); }
            return false;
          }
        }
        return true;
      });
      if (inv <= 0) rocks.forEach(function (r) {
        if (playing && Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + 9) {
          burst(ship.x, ship.y, 30); lives--; ui(); K.beep(90, 0.4, "sawtooth", 0.08);
          if (lives <= 0) { playing = false; var nb = hud.finish(score); setTimeout(function () { K.show(nb ? "新紀錄！" : "太空船被撞毀", "得分 " + score + "，到第 " + wave + " 波", "再玩一次", start); }, 700); }
          else { ship.x = W / 2; ship.y = H / 2; ship.vx = ship.vy = 0; inv = 2.5; }
        }
      });
      if (!rocks.length) { wave++; ui(); inv = 1.5; newWave(); }
    }
    function draw(dt) {
      ctx.clearRect(0, 0, W, H);
      if (!rocks) return;
      ctx.lineWidth = 2; ctx.strokeStyle = K.c("muted");
      rocks.forEach(function (r) {
        ctx.beginPath();
        r.pts.forEach(function (k, i) { var a = r.rot + i / r.pts.length * Math.PI * 2; ctx[i ? "lineTo" : "moveTo"](r.x + Math.cos(a) * r.r * k, r.y + Math.sin(a) * r.r * k); });
        ctx.closePath(); ctx.stroke();
      });
      ctx.fillStyle = K.c("gold"); shots.forEach(function (s) { ctx.fillRect(s.x - 2, s.y - 2, 4, 4); });
      bits.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; ctx.globalAlpha = Math.max(0, b.life); ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3); });
      bits = bits.filter(function (b) { return b.life > 0; }); ctx.globalAlpha = 1;
      if (playing && !(inv > 0 && (inv * 10 | 0) % 2)) {
        ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
        ctx.strokeStyle = K.c("accent"); ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-6, 0); ctx.lineTo(-10, 9); ctx.closePath(); ctx.stroke();
        if (ship.thrust) { ctx.strokeStyle = K.c("gold"); ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(-16 - Math.random() * 6, 0); ctx.lineTo(-7, 4); ctx.stroke(); }
        ctx.restore();
      }
    }
    K.loop(function (dt) { if (playing) update(dt); draw(dt); });
    K.show("隕石帶", "打碎所有隕石就進入下一波。\n大隕石會碎成小隕石，越小越值錢。", "出發", start);
  </script>
</body>
</html>
