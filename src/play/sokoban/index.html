<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>推箱子</title>
  <link rel="stylesheet" href="../kit/kit.css">
</head>
<body>
  <div class="wrap">
    <div class="bar"><span>第 <b id="lvl">1</b> / <span id="total"></span> 關</span><span>步數 <b id="score">0</b></span><span>已破 <b id="best">0</b> 關</span></div>
    <div class="stage"><canvas id="c" width="400" height="300"></canvas><div class="ov" id="ov" hidden></div></div>
    <div class="controls"><button type="button" class="ghost" id="prev">◀ 上一關</button><button type="button" class="ghost" id="undo">↶ 復原</button><button type="button" class="ghost" id="reset">重來</button><button type="button" class="ghost" id="next">下一關 ▶</button></div>
    <div class="pad" id="pad"></div>
    <p class="help">方向鍵或滑動移動，把所有箱子推到圓點上。箱子只能推、不能拉</p>
  </div>
  <script src="../kit/kit.js"></script>
  <script>
    var LEVELS = [["#####", "#@  #", "# $ #", "#  .#", "#####"], ["######", "#    #", "# #$ #", "# . @#", "######"], ["  ####", "###  #", "#. $ #", "#.$  #", "### @#", "  ####"], ["########", "#      #", "# .**. #", "# $  $ #", "#  @   #", "########"], ["#######", "#     #", "# $#$ #", "# .@. #", "#######"], [" #####", " #   ##", "##.$  #", "#  .$ #", "# @ ###", "#####"], ["########", "#   .  #", "# $$#  #", "#  @ . #", "###   ##", "  #####"], ["#######", "#  .  #", "# $$$ #", "#. @ .#", "#     #", "#######"], ["#######", "#.  # #", "# $   #", "#  #$ #", "## .@ #", " ######"], ["########", "#  #   #", "# $ .$ #", "#  ## .#", "#@ $.  #", "########"], ["  ######", "  #  . #", "### $  #", "#  $#. #", "#@ $ . #", "##     #", " #######"]];
    var cv = K.$("c"), ctx = cv.getContext("2d"), S = 44;
    var lvl = 0, walls, goals, boxes, me, moves, hist, solved = 0, done;
    try { solved = +localStorage.getItem("sokoban-solved") || 0; } catch (e) {}
    K.$("best").textContent = solved; K.$("total").textContent = LEVELS.length;
    K.pad([["◀", "ArrowLeft"], ["▲", "ArrowUp"], ["▼", "ArrowDown"], ["▶", "ArrowRight"]]);
    function key(x, y) { return x + "," + y; }
    function load(i) {
      lvl = K.clamp(i, 0, LEVELS.length - 1); var rows = LEVELS[lvl];
      walls = {}; goals = {}; boxes = {}; moves = 0; hist = []; done = false;
      rows.forEach(function (r, y) { for (var x = 0; x < r.length; x++) { var c = r[x], k = key(x, y);
        if (c === "#") walls[k] = 1; if (".*+".indexOf(c) >= 0) goals[k] = 1; if ("$*".indexOf(c) >= 0) boxes[k] = 1; if ("@+".indexOf(c) >= 0) me = { x: x, y: y }; } });
      cv.width = Math.max.apply(null, rows.map(function (r) { return r.length; })) * S; cv.height = rows.length * S;
      K.$("lvl").textContent = lvl + 1; K.$("score").textContent = 0; K.hide(); draw();
    }
    function move(dx, dy) {
      if (done) return;
      var nx = me.x + dx, ny = me.y + dy, k = key(nx, ny);
      if (walls[k]) return;
      var pushed = false;
      if (boxes[k]) {
        var k2 = key(nx + dx, ny + dy);
        if (walls[k2] || boxes[k2]) return;
        delete boxes[k]; boxes[k2] = 1; pushed = k2;
      }
      hist.push({ me: { x: me.x, y: me.y }, from: pushed ? k : null, to: pushed });
      me = { x: nx, y: ny }; moves++; K.$("score").textContent = moves;
      K.beep(pushed ? 220 : 400, 0.04, "triangle", 0.04);
      draw();
      if (Object.keys(goals).every(function (g) { return boxes[g]; })) {
        done = true; K.beep(880, 0.3);
        if (lvl + 1 > solved) { solved = lvl + 1; K.$("best").textContent = solved; try { localStorage.setItem("sokoban-solved", solved); } catch (e) {} }
        if (lvl < LEVELS.length - 1) K.show("過關！", "用了 " + moves + " 步", "下一關", function () { load(lvl + 1); });
        else K.show("全部破關！", "11 關都完成了，太厲害了", "從第一關再玩", function () { load(0); });
      }
    }
    function undo() {
      var h = hist.pop(); if (!h || done) return;
      me = h.me; if (h.to) { delete boxes[h.to]; boxes[h.from] = 1; }
      moves--; K.$("score").textContent = moves; draw();
    }
    addEventListener("keydown", function (e) {
      var d = { ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0], ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1] }[e.key];
      if (d) move(d[0], d[1]); if (e.key === "z" || e.key === "Backspace") undo();
    });
    K.swipe(cv, function (d) { move(d === "left" ? -1 : d === "right" ? 1 : 0, d === "up" ? -1 : d === "down" ? 1 : 0); });
    K.$("undo").onclick = undo; K.$("reset").onclick = function () { load(lvl); };
    K.$("prev").onclick = function () { load(lvl - 1); }; K.$("next").onclick = function () { load(lvl + 1); };
    function draw() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      LEVELS[lvl].forEach(function (r, y) { for (var x = 0; x < r.length; x++) {
        var k = key(x, y);
        if (walls[k]) { ctx.fillStyle = K.c("text"); ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.roundRect(x * S + 1, y * S + 1, S - 2, S - 2, 6); ctx.fill(); ctx.globalAlpha = 1; }
        if (goals[k]) { ctx.fillStyle = K.c("accent"); ctx.beginPath(); ctx.arc(x * S + S / 2, y * S + S / 2, 7, 0, 7); ctx.fill(); }
        if (boxes[k]) {
          ctx.fillStyle = K.c(goals[k] ? "accent2" : "gold"); ctx.beginPath(); ctx.roundRect(x * S + 5, y * S + 5, S - 10, S - 10, 5); ctx.fill();
          ctx.strokeStyle = K.c("bg"); ctx.globalAlpha = 0.5; ctx.lineWidth = 2; ctx.beginPath();
          ctx.moveTo(x * S + 10, y * S + 10); ctx.lineTo(x * S + S - 10, y * S + S - 10); ctx.moveTo(x * S + S - 10, y * S + 10); ctx.lineTo(x * S + 10, y * S + S - 10); ctx.stroke(); ctx.globalAlpha = 1;
        }
      } });
      var cx = me.x * S + S / 2, cy = me.y * S + S / 2;
      ctx.fillStyle = K.c("blue"); ctx.beginPath(); ctx.arc(cx, cy, S * 0.34, 0, 7); ctx.fill();
      ctx.fillStyle = K.c("bg"); ctx.beginPath(); ctx.arc(cx - 5, cy - 3, 3, 0, 7); ctx.arc(cx + 5, cy - 3, 3, 0, 7); ctx.fill();
    }
    load(Math.min(solved, LEVELS.length - 1));
  </script>
</body>
</html>
