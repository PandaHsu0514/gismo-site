<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>貪食蛇</title>
  <style>
    :root { --bg: #fbfaf7; --text: #1d1f23; --muted: #5d636e; --board: #e3efe9; --snake: #2f6f5e; --food: #c4572f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --text: #e8e6e1; --muted: #9aa0aa; --board: #1f322c; --snake: #7cc4ad; --food: #e8875f; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, "Noto Sans TC", sans-serif; touch-action: none; }
    .wrap { width: min(92vw, 420px); text-align: center; }
    .bar { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); }
    .bar b { color: var(--text); }
    canvas { width: 100%; aspect-ratio: 1; background: var(--board); border-radius: 12px; display: block; }
    button { margin-top: 12px; padding: 8px 24px; border: 0; border-radius: 999px; background: var(--snake); color: var(--bg); font: inherit; cursor: pointer; }
    p { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar"><span>分數 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div>
    <canvas id="c" width="400" height="400"></canvas>
    <button id="start">開始</button>
    <p>方向鍵／WASD，或在畫面上滑動</p>
  </div>
  <script>
    var N = 20, S = 20, cv = document.getElementById("c"), ctx = cv.getContext("2d");
    var css = getComputedStyle(document.documentElement);
    var snake, dir, next, food, score, timer, best = 0;
    try { best = +localStorage.getItem("snake-best") || 0; } catch (e) {}
    document.getElementById("best").textContent = best;

    function place() {
      do { food = { x: Math.random() * N | 0, y: Math.random() * N | 0 }; }
      while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
    }
    function start() {
      snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
      dir = next = { x: 1, y: 0 }; score = 0; place();
      document.getElementById("score").textContent = 0;
      document.getElementById("start").hidden = true;
      clearInterval(timer); timer = setInterval(step, 120);
    }
    function step() {
      dir = next;
      var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(function (s) { return s.x === h.x && s.y === h.y; })) return over();
      snake.unshift(h);
      if (h.x === food.x && h.y === food.y) { score++; document.getElementById("score").textContent = score; place(); }
      else snake.pop();
      draw();
    }
    function over() {
      clearInterval(timer);
      if (score > best) { best = score; document.getElementById("best").textContent = best; try { localStorage.setItem("snake-best", best); } catch (e) {} }
      var b = document.getElementById("start"); b.textContent = "再玩一次"; b.hidden = false;
    }
    function draw() {
      ctx.clearRect(0, 0, 400, 400);
      ctx.fillStyle = css.getPropertyValue("--food");
      ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 2, 0, 7); ctx.fill();
      ctx.fillStyle = css.getPropertyValue("--snake");
      snake.forEach(function (s, i) { ctx.globalAlpha = i ? 0.85 : 1; ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2); });
      ctx.globalAlpha = 1;
    }
    function turn(x, y) { if (dir && x !== -dir.x && y !== -dir.y) next = { x: x, y: y }; }
    addEventListener("keydown", function (e) {
      var k = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] }[e.key];
      if (k) { e.preventDefault(); turn(k[0], k[1]); }
    });
    var t0;
    addEventListener("touchstart", function (e) { t0 = e.touches[0]; }, { passive: true });
    addEventListener("touchend", function (e) {
      if (!t0) return;
      var dx = e.changedTouches[0].clientX - t0.clientX, dy = e.changedTouches[0].clientY - t0.clientY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
    });
    document.getElementById("start").addEventListener("click", start);
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }]; food = { x: 14, y: 10 }; draw();
  </script>
</body>
</html>
