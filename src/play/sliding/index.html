<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>數字華容道</title>
  <link rel="stylesheet" href="../kit/kit.css">
<style>
  .board { background: var(--line); padding: 8px; border-radius: 12px; }
  .cell { background: var(--surface); font: 900 clamp(22px, 8vw, 40px) "Noto Serif TC", serif; }
  .cell.ok { color: var(--accent2); }
  .cell.empty { background: transparent; cursor: default; }
  .controls button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar"><span>步數 <b id="score">0</b></span><span>時間 <b id="time">0</b> 秒</span><span>最少 <b id="best">—</b></span></div>
    <div class="controls" id="sz"><button type="button" data-n="3">3×3</button><button type="button" data-n="4" aria-pressed="true">4×4</button><button type="button" data-n="5">5×5</button></div>
    <div class="stage" style="margin-top:10px"><div class="board" id="b"></div><div class="ov" id="ov" hidden></div></div>
    <p class="help">點空格旁邊的數字把它滑過去，排成 1、2、3… 的順序</p>
  </div>
  <script src="../kit/kit.js"></script>
  <script>
    var el = K.$("b"), N = 4, tiles, moves, t0, timer, hud, done;
    function start() {
      hud = K.hud("sliding-best-" + N, { low: true });
      tiles = []; for (var i = 1; i < N * N; i++) tiles.push(i); tiles.push(0);
      var e = N * N - 1, last = -1;
      for (var k = 0; k < N * N * 40; k++) { // 從排好的狀態隨機滑動，保證有解
        var opts = nbrs(e).filter(function (j) { return j !== last; }), j = K.pick(opts);
        tiles[e] = tiles[j]; tiles[j] = 0; last = e; e = j;
      }
      moves = 0; done = false; hud.set(0); clearInterval(timer); t0 = null; K.$("time").textContent = 0;
      el.style.gridTemplateColumns = "repeat(" + N + ", 1fr)"; render(); K.hide();
    }
    function nbrs(i) { var r = [], x = i % N, y = i / N | 0; if (x > 0) r.push(i - 1); if (x < N - 1) r.push(i + 1); if (y > 0) r.push(i - N); if (y < N - 1) r.push(i + N); return r; }
    function render() {
      el.innerHTML = "";
      tiles.forEach(function (v, i) {
        var c = document.createElement("div"); c.className = "cell" + (v ? (v === i + 1 ? " ok" : "") : " empty"); c.textContent = v || ""; c.dataset.i = i;
        if (N === 5) c.style.fontSize = "clamp(18px, 6vw, 30px)";
        el.appendChild(c);
      });
    }
    function slide(i) {
      if (done) return;
      var e = tiles.indexOf(0); if (nbrs(e).indexOf(i) < 0) return;
      if (!t0) { t0 = Date.now(); timer = setInterval(function () { K.$("time").textContent = (Date.now() - t0) / 1000 | 0; }, 250); }
      tiles[e] = tiles[i]; tiles[i] = 0; moves++; hud.set(moves); render(); K.beep(400 + tiles[e] * 20, 0.04);
      if (tiles.every(function (v, k) { return k === N * N - 1 ? v === 0 : v === k + 1; })) {
        done = true; clearInterval(timer); var nb = hud.finish(moves);
        K.show(nb ? "新紀錄！" : "完成！", moves + " 步，" + Math.round((Date.now() - t0) / 1000) + " 秒", "再玩一次", start);
      }
    }
    el.addEventListener("click", function (e) { var c = e.target.closest(".cell"); if (c) slide(+c.dataset.i); });
    addEventListener("keydown", function (e) {
      var d = { ArrowLeft: 1, ArrowRight: -1, ArrowUp: N, ArrowDown: -N }[e.key]; if (!d) return;
      var em = tiles.indexOf(0), j = em + d;
      if (nbrs(em).indexOf(j) >= 0) slide(j);
    });
    K.$("sz").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return; N = +b.dataset.n;
      this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); start();
    });
    start();
  </script>
</body>
</html>
